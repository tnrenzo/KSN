name: Build master.pdf

on:
  push:
    branches: ["**"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: typst-community/setup-typst@v5
        with:
          typst-version: ^0.15.1

      - name: Compile master.pdf
        run: typst compile master.typ master.pdf --font-path fonts

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: master-pdf
          path: master.pdf
          if-no-files-found: error

      - name: Update rolling release
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Clear the old release and tag so "latest" points at this commit.
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          git push origin :refs/tags/latest 2>/dev/null || true

          gh release create latest master.pdf \
            --title "Latest build" \
            --notes "Built from ${GITHUB_SHA::7} on $(date -u '+%Y-%m-%d %H:%M UTC')." \
            --latest